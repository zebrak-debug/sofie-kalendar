<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sofiin kalendář ♥</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#e26d8a;
    --rose-deep:#b8476a;
    --rose-soft:#f7d9e2;
    --rose-bg:#fff5f7;
    --cream:#fffafb;
    --ink:#4a2733;
    --ink-soft:#8a6470;
    --gold:#d9a441;
    --shadow:rgba(184,71,106,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Jost',sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 20% -10%, #ffe6ee 0%, transparent 55%),
      radial-gradient(1000px 500px at 100% 0%, #ffdfe8 0%, transparent 50%),
      linear-gradient(180deg,#fff5f7 0%,#ffeef3 100%);
    background-attachment:fixed;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:48px 20px 80px;}
  header{text-align:center;margin-bottom:14px;}
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;font-size:clamp(38px,7vw,66px);
    line-height:1.02;color:var(--ink);letter-spacing:.5px;
  }
  h1 .heart{color:var(--rose);}
  .sub{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:clamp(17px,2.6vw,22px);color:var(--ink-soft);
    margin-top:12px;
  }
  .progress{
    margin:30px auto 6px;max-width:420px;
    font-size:13px;color:var(--ink-soft);letter-spacing:.08em;
    display:flex;align-items:center;gap:14px;
  }
  .bar{flex:1;height:6px;border-radius:99px;background:#f4d3dd;overflow:hidden;}
  .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--rose-deep));border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1);}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
    gap:14px;margin-top:40px;
  }
  .cell{
    position:relative;aspect-ratio:1;border-radius:18px;cursor:pointer;
    border:1px solid #f3c9d6;
    background:linear-gradient(160deg,#ffffff 0%,#fff0f4 100%);
    box-shadow:0 6px 18px var(--shadow), inset 0 1px 0 rgba(255,255,255,.7);
    display:flex;align-items:center;justify-content:center;
    transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, border-color .25s;
    -webkit-tap-highlight-color:transparent;overflow:hidden;
  }
  .cell .num{
    font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;
    color:var(--rose-deep);transition:opacity .2s;
  }
  .cell.available{
    border-color:var(--rose);
    background:linear-gradient(160deg,#ffd9e4 0%,#ffc2d4 100%);
    animation:pulse 2.6s ease-in-out infinite;
  }
  .cell.available .num{color:var(--rose-deep);}
  .cell.available::before{
    content:"♥";position:absolute;top:7px;right:9px;font-size:12px;color:var(--rose-deep);opacity:.7;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 6px 18px var(--shadow), 0 0 0 0 rgba(226,109,138,.45);}
    50%{box-shadow:0 8px 22px var(--shadow), 0 0 0 8px rgba(226,109,138,0);}
  }
  .cell.opened{
    background:linear-gradient(160deg,#fff 0%,#fbe8ee 100%);
    border-color:#f0bccb;
  }
  .cell.opened .num{opacity:.35;}
  .cell.opened::before{
    content:"♥";position:absolute;top:7px;right:9px;font-size:13px;color:var(--rose);opacity:.85;
  }
  .cell.locked{cursor:not-allowed;opacity:.62;background:linear-gradient(160deg,#fbfbfb,#f6eef1);}
  .cell.locked .num{color:#c9a9b4;}
  .cell.locked::before{
    content:"\1F512";position:absolute;bottom:7px;right:8px;font-size:11px;opacity:.5;
  }
  .cell:hover:not(.locked){transform:translateY(-4px) scale(1.03);box-shadow:0 14px 30px var(--shadow);}
  .cell:active:not(.locked){transform:translateY(-1px) scale(.99);}

  .overlay{
    position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    padding:24px;background:rgba(74,39,51,.42);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .35s;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .card{
    position:relative;max-width:440px;width:100%;text-align:center;
    background:linear-gradient(165deg,#fffdfd 0%,#fff3f7 100%);
    border-radius:26px;padding:52px 38px 44px;
    border:1px solid #f6cdd9;
    box-shadow:0 30px 70px rgba(184,71,106,.28);
    transform:translateY(20px) scale(.96);transition:transform .4s cubic-bezier(.2,.9,.2,1);
  }
  .overlay.show .card{transform:translateY(0) scale(1);}
  .card .day-label{
    font-size:12px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--rose-deep);opacity:.8;margin-bottom:20px;
  }
  .card .big-heart{font-size:42px;color:var(--rose);line-height:1;margin-bottom:18px;display:block;}
  .card .msg{
    font-family:'Cormorant Garamond',serif;font-weight:500;
    font-size:clamp(23px,4.4vw,30px);line-height:1.35;color:var(--ink);
  }
  .card .sign{
    margin-top:26px;font-family:'Cormorant Garamond',serif;font-style:italic;
    font-size:19px;color:var(--ink-soft);
  }
  .close{
    margin-top:30px;border:none;cursor:pointer;
    font-family:'Jost',sans-serif;font-size:14px;letter-spacing:.14em;text-transform:uppercase;
    color:#fff;background:linear-gradient(90deg,var(--rose),var(--rose-deep));
    padding:13px 34px;border-radius:99px;
    box-shadow:0 10px 24px rgba(184,71,106,.35);transition:transform .2s,box-shadow .2s;
  }
  .close:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(184,71,106,.45);}
  .close:active{transform:translateY(0);}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:13px 22px;border-radius:99px;
    font-size:14px;letter-spacing:.02em;opacity:0;pointer-events:none;transition:all .35s;
    box-shadow:0 12px 30px rgba(0,0,0,.2);z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .setup-note{
    max-width:520px;margin:22px auto 0;text-align:center;font-size:13.5px;
    color:var(--ink-soft);line-height:1.7;background:rgba(255,255,255,.55);
    border:1px dashed #f0c3d1;border-radius:16px;padding:14px 18px;
  }
  .setup-note strong{color:var(--rose-deep);}

  .surprise{
    margin-top:22px;border:none;cursor:pointer;
    font-family:'Jost',sans-serif;font-size:14px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--rose-deep);background:#fff;
    padding:12px 30px;border-radius:99px;border:1.5px solid var(--rose);
    box-shadow:0 6px 18px rgba(184,71,106,.2);transition:transform .2s,box-shadow .2s,background .2s;
  }
  .surprise:hover{transform:translateY(-2px);background:var(--rose);color:#fff;box-shadow:0 10px 26px rgba(184,71,106,.35);}
  .surprise:active{transform:translateY(0);}
  .surprise-text{
    margin-top:20px;max-height:0;overflow:hidden;opacity:0;
    font-family:'Cormorant Garamond',serif;font-weight:500;font-style:italic;
    font-size:clamp(19px,3.6vw,24px);line-height:1.4;color:var(--rose-deep);
    transition:max-height .6s ease, opacity .6s ease, margin .6s ease;
  }
  .surprise-text.show{max-height:300px;opacity:1;}
  .surprise-img{width:100%;border-radius:18px;border:1px solid #f0bccb;display:none;margin-top:16px;opacity:0;transition:opacity .6s ease;}
  .surprise-img.show{display:block;opacity:1;}

  .quiz-box{max-height:0;overflow:hidden;opacity:0;transition:max-height .5s ease,opacity .5s ease,margin .5s ease;margin-top:0;}
  .quiz-box.show{max-height:280px;opacity:1;margin-top:10px;}
  .quiz-q{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(18px,3.4vw,22px);color:var(--rose-deep);margin:0 0 16px;}
  #quiz-answer{width:100%;box-sizing:border-box;padding:13px 16px;font-family:'Jost',sans-serif;font-size:16px;text-align:center;color:var(--ink);background:#fff;border:1.5px solid #f0bccb;border-radius:14px;outline:none;transition:border-color .3s;}
  #quiz-answer:focus{border-color:var(--rose);}
  .quiz-check{margin-top:14px;border:none;cursor:pointer;font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:linear-gradient(90deg,var(--rose),var(--rose-deep));padding:12px 30px;border-radius:99px;box-shadow:0 8px 20px rgba(184,71,106,.3);transition:transform .2s;}
  .quiz-check:hover{transform:translateY(-2px);}
  .quiz-hint{min-height:20px;margin:12px 0 0;font-family:'Jost',sans-serif;font-size:14px;color:#c0607e;}
  .quiz-reward{max-height:0;overflow:hidden;opacity:0;transition:max-height .7s ease,opacity .7s ease,margin .7s ease;margin-top:0;}
  .quiz-reward.show{max-height:900px;opacity:1;margin-top:22px;}
  .quiz-img{width:100%;border-radius:18px;border:1px solid #f0bccb;display:block;}
  .quiz-reward-text{font-family:'Cormorant Garamond',serif;font-weight:500;font-style:italic;font-size:clamp(20px,4vw,26px);line-height:1.4;color:var(--rose-deep);margin:20px 0 0;}

  .cd-wrap{margin-top:26px;padding:20px 16px;border-radius:18px;background:linear-gradient(135deg,#ffe3ec,#ffd0de);border:1px solid #f3c0d0;}
  .cd-label{font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--rose-deep);opacity:.85;margin-bottom:12px;}
  .cd-boxes{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
  .cd-box{min-width:58px;background:#fff;border-radius:12px;padding:10px 6px;box-shadow:0 4px 10px rgba(184,71,106,.12);}
  .cd-num{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:var(--rose-deep);line-height:1;}
  .cd-unit{font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-top:5px;}
  .cd-done{display:none;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;color:var(--rose-deep);}

  .graf-wrap{margin-top:22px;}
  .graf-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--ink);margin-top:16px;}
  .graf-legend{display:flex;flex-direction:column;gap:8px;margin-top:14px;align-items:center;}
  .graf-legend .row{display:flex;align-items:center;gap:8px;font-family:'Jost',sans-serif;font-size:15px;color:var(--ink);}
  .graf-legend .dot{width:14px;height:14px;border-radius:50%;display:inline-block;}
  .graf-legend .pct{color:var(--ink-soft);}

  .slidy-wrap{margin-top:22px;}
  .slidy-text{min-height:70px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;color:var(--rose-deep);transition:opacity .25s;text-align:center;}
  .slidy-progress{font-family:'Jost',sans-serif;font-size:12px;color:var(--ink-soft);letter-spacing:.05em;margin-top:6px;}
  .slidy-btn{margin-top:18px;border:none;cursor:pointer;font-family:'Jost',sans-serif;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:linear-gradient(90deg,var(--rose),var(--rose-deep));padding:13px 34px;border-radius:99px;box-shadow:0 10px 24px rgba(184,71,106,.35);transition:transform .2s;}
  .slidy-btn:hover{transform:translateY(-2px);}

  .fly-emoji{position:fixed;pointer-events:none;z-index:80;will-change:transform;user-select:none;}
  .petal{position:fixed;top:-30px;font-size:18px;color:var(--rose);pointer-events:none;z-index:70;opacity:.9;will-change:transform;}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Sofiin kalendář <span class="heart">♥</span></h1>
      <p class="sub">Každý den, co jsi pryč, jedno okénko jen pro tebe.</p>
      <div class="progress">
        <span id="prog-label">0/60</span>
        <div class="bar"><span id="prog-fill" style="width:0%"></span></div>
      </div>
      <div class="setup-note" id="setup-note"></div>
    </header>

    <div class="grid" id="grid"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <div class="day-label" id="day-label">Den 1</div>
      <span class="big-heart">♥</span>
      <p class="msg" id="msg"></p>
      <button class="surprise" id="surprise" style="display:none">Překvapení ♥</button>
      <p class="surprise-text" id="surprise-text"></p>
      <img class="surprise-img" id="surprise-img" alt="" />

      <button class="surprise" id="quiz-start" style="display:none">Jdu do toho!</button>
      <div id="quiz" class="quiz-box">
        <p class="quiz-q" id="quiz-q"></p>
        <input id="quiz-answer" type="text" inputmode="numeric" placeholder="" autocomplete="off" />
        <button id="quiz-check" class="quiz-check">Potvrdit</button>
        <p class="quiz-hint" id="quiz-hint"></p>
      </div>
      <div id="quiz-reward" class="quiz-reward">
        <img id="quiz-img" class="quiz-img" alt="" />
        <p class="quiz-reward-text" id="quiz-reward-text"></p>
      </div>

      <div id="countdown" class="cd-wrap" style="display:none">
        <div class="cd-label" id="cd-label">Než za tebou přijedu</div>
        <div class="cd-boxes" id="cd-boxes"></div>
        <div class="cd-done" id="cd-done"></div>
      </div>

      <div id="graf" class="graf-wrap" style="display:none">
        <svg id="graf-svg" viewBox="0 0 200 200" style="width:180px;height:180px;transform:rotate(-90deg)"></svg>
        <div class="graf-title" id="graf-title"></div>
        <div class="graf-legend" id="graf-legend"></div>
      </div>

      <div id="slidy" class="slidy-wrap" style="display:none">
        <div class="slidy-text" id="slidy-text"></div>
        <div class="slidy-progress" id="slidy-progress"></div>
        <button class="slidy-btn" id="slidy-btn">Dál →</button>
      </div>

      <p class="sign">— tvůj Bambínek</p>
      <button class="close" id="close">Zavřít</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const TOTAL_DAYS = 62;
const STORAGE = 'sofie_kalendar_opened';

const grid = document.getElementById('grid');
const overlay = document.getElementById('overlay');
const msgEl = document.getElementById('msg');
const dayLabel = document.getElementById('day-label');
const toast = document.getElementById('toast');

let START_DATE = new Date();
let COMPLIMENTS = [];
let SURPRISES = {};

const surpriseBtn = document.getElementById('surprise');
const surpriseText = document.getElementById('surprise-text');
const surpriseImg = document.getElementById('surprise-img');
let QUIZZES = {};
const quizStart = document.getElementById('quiz-start');
const quizBox = document.getElementById('quiz');
const quizQ = document.getElementById('quiz-q');
const quizAnswer = document.getElementById('quiz-answer');
const quizCheck = document.getElementById('quiz-check');
const quizHint = document.getElementById('quiz-hint');
const quizReward = document.getElementById('quiz-reward');
const quizImg = document.getElementById('quiz-img');
const quizRewardText = document.getElementById('quiz-reward-text');
let activeQuiz = null;
let COUNTDOWNS = {};
let cdTimer = null;
const countdownWrap = document.getElementById('countdown');
const cdLabel = document.getElementById('cd-label');
const cdBoxes = document.getElementById('cd-boxes');
const cdDone = document.getElementById('cd-done');
let GRAFY = {};
let SLIDY = {};
const grafWrap = document.getElementById('graf');
const grafSvg = document.getElementById('graf-svg');
const grafTitle = document.getElementById('graf-title');
const grafLegend = document.getElementById('graf-legend');
const slidyWrap = document.getElementById('slidy');
const slidyText = document.getElementById('slidy-text');
const slidyProgress = document.getElementById('slidy-progress');
const slidyBtn = document.getElementById('slidy-btn');

function midnight(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function todayIndex(){return Math.floor((midnight(new Date())-midnight(START_DATE))/86400000);}
function getOpened(){try{return JSON.parse(localStorage.getItem(STORAGE))||[];}catch(e){return [];}}
function setOpened(a){try{localStorage.setItem(STORAGE,JSON.stringify(a));}catch(e){}}
function fmtDate(i){const d=new Date(START_DATE);d.setDate(d.getDate()+i);return d.getDate()+'.'+(d.getMonth()+1)+'.';}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.classList.remove('show'),2600);}

// Načtení hlášek z hlasky.json (cache-busting, aby se vždy načetla nejnovější verze)
fetch('hlasky.json?v='+Date.now())
  .then(r=>r.json())
  .then(data=>{
    const parts=data.start_date.split('-');
    START_DATE=new Date(+parts[0], +parts[1]-1, +parts[2]);
    COMPLIMENTS=data.hlasky||[];
    SURPRISES=data.prekvapeni||{};
    QUIZZES=data.kvizy||{};
    COUNTDOWNS=data.odpocty||{};
    GRAFY=data.grafy||{};
    SLIDY=data.slidy||{};
    build();
  })
  .catch(err=>{
    document.getElementById('setup-note').innerHTML='Nepodařilo se načíst hlášky (hlasky.json). Zkontroluj soubor. ♥';
    console.error(err);
  });

function build(){
  const opened=getOpened();
  const ti=todayIndex();
  grid.innerHTML='';

  for(let i=0;i<TOTAL_DAYS;i++){
    const cell=document.createElement('div');
    cell.className='cell';
    cell.innerHTML='<span class="num">'+(i+1)+'</span>';

    const hasText = i < COMPLIMENTS.length && COMPLIMENTS[i] && COMPLIMENTS[i].trim()!=='';

    if(i>ti || !hasText){ cell.classList.add('locked'); }
    else if(opened.includes(i)){ cell.classList.add('opened'); }
    else { cell.classList.add('available'); }

    cell.addEventListener('click',()=>{
      if(i>ti){
        const d=Math.abs(i-ti);
        showToast('Ještě ne ♥ Otevře se za '+d+' '+(d===1?'den':(d<5?'dny':'dní')));
        return;
      }
      if(!hasText){ showToast('Tahle vzkaz se teprve chystá ♥'); return; }
      openWindow(i,cell,opened);
    });
    grid.appendChild(cell);
  }
  updateProgress();
  setupNote(ti);
}

function openWindow(i,cell,opened){
  dayLabel.textContent='Den '+(i+1)+'  ·  '+fmtDate(i);
  msgEl.textContent=COMPLIMENTS[i];

  // Reset překvapení a nastavení, pokud pro tento den existuje
  surpriseText.classList.remove('show');
  surpriseText.textContent='';
  surpriseImg.classList.remove('show');
  surpriseImg.removeAttribute('src');
  const sur = SURPRISES[i+1]; // klíč v JSONu = číslo dne (1–60)
  if(sur){
    surpriseBtn.style.display='inline-block';
    surpriseBtn.textContent = sur.tlacitko || 'Překvapení ♥';
    surpriseBtn.onclick = ()=>{
      flyEmoji(sur.emoji || '🍉');
      if(sur.foto){ flyPhotos(sur.foto); }
      setTimeout(()=>{
        surpriseText.textContent = sur.text || '';
        surpriseText.classList.add('show');
        if(sur.foto){
          surpriseImg.src = sur.foto;
          surpriseImg.classList.add('show');
        }
      }, 800);
    };
  } else {
    surpriseBtn.style.display='none';
    surpriseBtn.onclick=null;
  }

  // Reset kvízu a nastavení, pokud pro tento den existuje
  quizBox.classList.remove('show');
  quizReward.classList.remove('show');
  quizAnswer.value='';
  quizHint.textContent='';
  const q = QUIZZES[i+1];
  if(q){
    activeQuiz = q;
    quizStart.style.display='inline-block';
    quizStart.textContent = q.tlacitko || 'Jdu do toho!';
    quizQ.textContent = q.otazka || '';
    quizAnswer.placeholder = q.napoveda || '';
    quizStart.onclick = ()=>{
      quizStart.style.display='none';
      quizBox.classList.add('show');
      quizAnswer.focus();
    };
  } else {
    activeQuiz = null;
    quizStart.style.display='none';
    quizStart.onclick=null;
  }

  // Reset a nastavení odpočtu, pokud pro tento den existuje
  if(cdTimer){clearInterval(cdTimer);cdTimer=null;}
  const cdConf = COUNTDOWNS[i+1];
  if(cdConf){
    countdownWrap.style.display='block';
    cdLabel.textContent = cdConf.popisek || 'Než za tebou přijedu';
    startCountdown(cdConf);
  } else {
    countdownWrap.style.display='none';
  }

  // Graf, pokud pro tento den existuje
  const grafConf = GRAFY[i+1];
  if(grafConf){
    grafWrap.style.display='block';
    renderGraf(grafConf);
  } else {
    grafWrap.style.display='none';
  }

  // Slidy, pokud pro tento den existují
  const slidyConf = SLIDY[i+1];
  if(slidyConf){
    slidyWrap.style.display='block';
    startSlidy(slidyConf);
  } else {
    slidyWrap.style.display='none';
  }

  overlay.classList.add('show');
  if(!opened.includes(i)){
    opened.push(i);setOpened(opened);
    cell.classList.remove('available');cell.classList.add('opened');
    petals();updateProgress();
  }
}

// Emoji, která prolétnou přes celou obrazovku
function flyEmoji(emoji){
  const count=28;
  for(let k=0;k<count;k++){
    const e=document.createElement('div');
    e.className='fly-emoji';

// Kontrola odpovědi v kvízu — porovnává jen číslice, takže projdou všechny zápisy data
function normDigits(s){return (s||'').replace(/\D/g,'');}
function checkQuiz(){
  if(!activeQuiz) return;
  const given = normDigits(quizAnswer.value);
  const accepted = (activeQuiz.spravne || []).map(normDigits);
  if(accepted.includes(given) && given!==''){
    quizHint.style.color='#3c9a6a';
    quizHint.textContent = activeQuiz.spravne_hlaska || 'Správně! ♥';
    heartsBurst();
    if(activeQuiz.foto){ quizImg.src = activeQuiz.foto; quizImg.style.display='block'; }
    else { quizImg.style.display='none'; }
    quizRewardText.textContent = activeQuiz.odmena_text || '';
    setTimeout(()=>{
      quizBox.classList.remove('show');
      quizReward.classList.add('show');
    }, 550);
  } else {
    quizHint.style.color='#c0607e';
    quizHint.textContent = activeQuiz.spatne_hlaska || 'Skoro... zkus to znovu ♥';
    quizAnswer.style.borderColor='#e26d8a';
    setTimeout(()=>{quizAnswer.style.borderColor='#f0bccb';},600);
  }
}
quizCheck.addEventListener('click',checkQuiz);
quizAnswer.addEventListener('keydown',e=>{if(e.key==='Enter')checkQuiz();});

// Odpočet do cílového času (formát cíle: "2026-09-02T12:25")
function startCountdown(conf){
  const parts = (conf.cil||'').match(/(\d+)-(\d+)-(\d+)T(\d+):(\d+)/);
  if(!parts){countdownWrap.style.display='none';return;}
  const target = new Date(+parts[1], +parts[2]-1, +parts[3], +parts[4], +parts[5], 0).getTime();

  function pad(n){return (n<10?'0':'')+n;}
  function box(v,l){return '<div class="cd-box"><div class="cd-num">'+v+'</div><div class="cd-unit">'+l+'</div></div>';}

  function tick(){
    const diff = target - Date.now();
    if(diff<=0){
      cdBoxes.style.display='none';
      cdDone.style.display='block';
      cdDone.textContent = conf.hotovo_text || 'Už jsem tu ♥';
      if(cdTimer){clearInterval(cdTimer);cdTimer=null;}
      return;
    }
    cdBoxes.style.display='flex';
    cdDone.style.display='none';
    let s=Math.floor(diff/1000);
    const d=Math.floor(s/86400); s-=d*86400;
    const h=Math.floor(s/3600); s-=h*3600;
    const m=Math.floor(s/60); s-=m*60;
    cdBoxes.innerHTML = box(d,'dny')+box(pad(h),'hod')+box(pad(m),'min')+box(pad(s),'sek');
  }
  tick();
  cdTimer = setInterval(tick,1000);
}

// Koláčový graf: conf = { titulek, casti:[{popisek, hodnota, barva}, ...] }
function renderGraf(conf){
  const casti = conf.casti || [];
  const total = casti.reduce((s,c)=>s+(c.hodnota||0),0) || 1;
  const R=80, C=2*Math.PI*R;
  let offset=0;
  let svg='';
  casti.forEach(c=>{
    const frac=(c.hodnota||0)/total;
    const len=frac*C;
    svg+='<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="'+(c.barva||'#e26d8a')+'" stroke-width="40" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-offset)+'"></circle>';
    offset+=len;
  });
  grafSvg.innerHTML=svg;
  grafTitle.textContent=conf.titulek||'';
  let leg='';
  casti.forEach(c=>{
    leg+='<div class="row"><span class="dot" style="background:'+(c.barva||'#e26d8a')+'"></span> '+(c.popisek||'')+' <span class="pct">('+(c.hodnota||0)+' %)</span></div>';
  });
  grafLegend.innerHTML=leg;
}

// Proklikávací slidy: conf = { casti:[...] }
let slidyState={list:[],idx:0};
function startSlidy(conf){
  slidyState.list = conf.casti || [];
  slidyState.idx = 0;
  renderSlide();
}
function renderSlide(){
  const list=slidyState.list;
  if(!list.length) return;
  slidyText.style.opacity='0';
  setTimeout(()=>{
    slidyText.textContent=list[slidyState.idx];
    slidyProgress.textContent=(slidyState.idx+1)+' / '+list.length;
    slidyText.style.opacity='1';
    slidyBtn.textContent = (slidyState.idx===list.length-1) ? 'Znovu ↺' : 'Dál →';
  },200);
}
slidyBtn.addEventListener('click',()=>{
  if(slidyState.idx>=slidyState.list.length-1){slidyState.idx=0;}
  else{slidyState.idx++;}
  renderSlide();
});

function updateProgress(){
  const n=getOpened().length;
  document.getElementById('prog-label').textContent=n+'/'+TOTAL_DAYS;
  document.getElementById('prog-fill').style.width=(n/TOTAL_DAYS*100)+'%';
}

function setupNote(ti){
  const note=document.getElementById('setup-note');
  if(ti<0){ note.innerHTML='Kalendář startuje <strong>'+fmtDate(0)+'</strong> Do té doby jsou okénka zamčená. ♥'; }
  else if(ti>=TOTAL_DAYS){ note.innerHTML='Vítej zpátky ♥ Všechna okénka jsou otevřená — klidně se k nim vracej.'; }
  else{ note.innerHTML='Dnešní okénko je <strong>'+(ti+1)+'</strong> a svítí růžově. Otevírej vždycky jen jedno denně. ♥'; }
}
